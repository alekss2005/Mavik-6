<!DOCTYPE html>
<html lang="uk" data-theme="military">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>KYIV OSINT RADAR v16.3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root, [data-theme="military"]{
  --bg:#050a10; --panel:rgba(8,16,24,.92); --panel-solid:#0b1520;
  --text:#e8f0f5; --muted:#7a8f9e; --accent:#22d3ee; --accent-soft:rgba(34,211,238,.15);
  --danger:#ef4444; --ok:#34d399; --warn:#fbbf24;
  --border:rgba(34,211,238,.18); --header-bg:rgba(5,10,16,.94);
  --btn-bg:rgba(12,22,32,.9); --btn-border:rgba(148,163,184,.22);
  --glow:0 0 12px rgba(34,211,238,.35);
  --radius:12px; --font:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --card-h:0px;
}
body.card-on{--card-h:132px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:var(--font-ui);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.header{min-height:42px;background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:6px 12px;padding-top:calc(6px + var(--safe-top));z-index:1000;backdrop-filter:blur(16px);flex:0 0 auto;font-size:12px;gap:8px}
.logo{font-weight:800;letter-spacing:.06em;font-size:11px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--font)}
.logo-icon{font-size:14px;filter:drop-shadow(0 0 6px var(--accent))}
.header-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.search-box{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:999px;overflow:hidden;height:32px;flex:1;max-width:260px;min-width:100px}
.search-box input{background:transparent;border:0;color:var(--text);padding:0 12px;font-size:12px;width:100%;outline:none;font-family:var(--font-ui)}
.search-box input::placeholder{color:var(--muted)}
.search-box button{background:transparent;border:0;color:var(--accent);width:34px;height:32px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lang-btn-header{background:var(--btn-bg);border:1px solid var(--border);color:var(--accent);padding:0;border-radius:999px;font-size:11px;line-height:1;cursor:pointer;font-weight:800;min-width:34px;width:34px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--font)}
.lang-btn-header.en{color:var(--ok)}
.status{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;font-family:var(--font);letter-spacing:.04em}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);transition:background .3s,box-shadow .3s}
.status-dot.err{background:var(--danger);box-shadow:0 0 10px var(--danger)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.ballistic-timer{display:none;padding:0 10px;height:32px;border-radius:999px;align-items:center;justify-content:center;font-family:var(--font);font-weight:900;font-size:12px;line-height:1;color:#fff;background:#7c2d12;border:2px solid #fca5a5;box-shadow:0 0 12px rgba(220,38,38,.7);letter-spacing:.04em;flex:0 0 auto;min-width:66px;white-space:nowrap;animation:btPulse 1s ease-in-out infinite}
.ballistic-timer.show{display:inline-flex}
@keyframes btPulse{0%,100%{box-shadow:0 0 12px rgba(220,38,38,.7);transform:scale(1)}50%{box-shadow:0 0 24px rgba(220,38,38,1);transform:scale(1.04)}}
.search-results{position:absolute;top:calc(48px + var(--safe-top));right:10px;left:10px;z-index:5000;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:400px;margin-left:auto;max-height:260px;overflow-y:auto;width:280px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.search-results.show{display:block}
.search-item{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid rgba(148,163,184,.12)}
.search-item:hover,.search-item.active{background:rgba(59,130,246,.18)}
.search-item .name{font-weight:700;color:var(--text)}
.search-item .addr{font-size:10px;color:var(--muted);margin-top:2px}
#map{flex:1;min-height:0;width:100%;background:var(--bg)}
[data-theme="military"] #map{background:#dbe4ee}
.top-alert{position:absolute;top:calc(48px + var(--safe-top) + 8px);left:6px;right:6px;z-index:4600;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.top-alert.show{display:block;animation:alertIn .3s ease-out}
@keyframes alertIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.top-alert.ballistic{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d);color:#fff;animation:bbPulse .6s ease-in-out infinite;border:1px solid #fca5a5}
@keyframes bbPulse{0%,100%{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d)}50%{background:linear-gradient(90deg,#dc2626,#fca5a5,#dc2626)}}
.top-alert.impact{background:linear-gradient(90deg,#7c2d12,#ea580c,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert.falling{background:linear-gradient(90deg,#78350f,#f59e0b,#78350f);color:#fff;border:1px solid #fcd34d}
.top-alert.shot{background:linear-gradient(90deg,#14532d,#16a34a,#14532d);color:#fff;border:1px solid #86efac}
.top-alert.fire{background:linear-gradient(90deg,#7c2d12,#f97316,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert-inner{padding:9px 34px 9px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:.86rem;line-height:1.25}
.top-alert-icon{font-size:1.4rem;flex-shrink:0;line-height:1}
.top-alert-body{flex:1;min-width:0}
.top-alert-title{font-weight:800;font-size:.86rem}
.top-alert-place{font-size:.78rem;font-weight:700;margin-top:2px;opacity:.95}
.top-alert-meta{font-size:.68rem;font-weight:700;opacity:.85;margin-top:2px}
.top-alert-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.25);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;font-weight:700;padding:0}
.mass-banner{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4620;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.6);background:linear-gradient(135deg,#4c1d95,#7c3aed,#4c1d95);border:1px solid #c4b5fd;color:#fff}
.mass-banner.show{display:block}
.mass-banner-inner{padding:6px 30px 6px 10px;display:flex;align-items:center;gap:10px;font-size:.72rem;line-height:1.2}
.mass-banner-icon{font-size:1.5rem;flex-shrink:0}
.mass-banner-body{flex:1;min-width:0}
.mass-banner-title{font-weight:800;font-size:.86rem}
.mass-banner-line{font-size:.74rem;font-weight:700;margin-top:3px;opacity:.95}
.mass-banner-line b{color:#fde047}
.mass-banner-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.3);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;padding:0}
.strategic-panel{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4550;background:rgba(15,23,42,.95);border:1px solid rgba(250,204,21,.5);border-radius:10px;padding:8px 12px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:.72rem;max-height:30vh;overflow-y:auto}
.strategic-panel.show{display:block}
.strategic-panel-title{font-weight:800;color:#facc15;margin-bottom:6px;font-size:.78rem;display:flex;justify-content:space-between;align-items:center}
.strategic-panel-close{background:0;border:0;color:#facc15;font-size:1.1rem;cursor:pointer;padding:0 4px;line-height:1}
.strategic-panel-item{color:#e2e8f0;padding:3px 0;border-bottom:1px solid rgba(148,163,184,.15);display:flex;align-items:flex-start;gap:6px}
.strategic-panel-item .s-ico{flex-shrink:0}
.strategic-panel-item .s-text{flex:1;min-width:0}
.strategic-panel-summary{color:#fca5a5;font-weight:800;margin-top:6px;padding-top:6px;border-top:1px solid rgba(220,38,38,.4);font-size:.7rem}
.hud-bottom{position:absolute;bottom:calc(10px + var(--safe-bottom) + var(--card-h));left:0;right:0;z-index:1200;padding:0 8px;pointer-events:none;transition:bottom .28s}
.hud-bottom>*{pointer-events:auto}
.btn-row{display:flex;gap:4px;overflow-x:auto;padding:5px 6px;background:var(--panel);border:1px solid var(--border);border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%;backdrop-filter:blur(14px)}
.btn-row::-webkit-scrollbar{display:none}
.btn-row button{border-radius:999px;min-width:38px;height:38px;flex:0 0 38px;border-color:transparent;background:transparent;transition:background .12s,transform .08s}
.btn-row button:active{transform:scale(.92);background:rgba(34,211,238,.14)}
.btn-row button.on{background:var(--accent-soft);border-color:rgba(34,211,238,.5)}
button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text);padding:0;border-radius:var(--radius);font-size:.95rem;line-height:1;cursor:pointer;font-weight:700;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:border-color .15s,box-shadow .15s,background .15s,transform .08s}
button:active{background:var(--accent-soft);transform:scale(.94)}
button.danger{color:#fca5a5}
button.on{border-color:var(--accent);box-shadow:var(--glow);background:var(--accent-soft)}
button.siren-btn{color:var(--danger)}
button.siren-btn.active{background:var(--danger)!important;color:#fff!important;animation:sirenFlash .35s ease-in-out infinite;border-color:var(--danger)}
button.infra-btn.infrastructure{border-color:#3b82f6;color:#93c5fd}
button.infra-btn.energy{border-color:var(--warn);color:var(--warn)}
button.infra-btn.incidents{border-color:var(--danger);color:#fca5a5}
button.sound-btn.muted{color:var(--danger);border-color:transparent;background:var(--btn-bg)}
button.sound-btn.on{color:var(--ok)}
button.mass-btn.on{color:#c4b5fd;border-color:#a78bfa}
button.fs-btn.on{background:rgba(99,102,241,.9);color:#fff}
button.visual-btn.on{color:#facc15;border-color:#facc15;box-shadow:0 0 10px rgba(250,204,21,.4)}
@keyframes sirenFlash{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.8)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
.leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--text);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 8px 28px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:rgba(7,16,24,.97)}
.leaflet-popup-content{margin:9px 11px;font-size:.75rem;line-height:1.4;max-width:250px}
.leaflet-popup-close-button{color:#94a3b8!important;font-size:18px!important;padding:2px 6px!important}
.popup-title{font-weight:700;font-size:.82rem;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.popup-meta{color:#94a3b8;font-size:.68rem}
.popup-channels{margin-top:6px;padding-top:5px;border-top:1px solid rgba(148,163,184,.18);font-size:.66rem}
.popup-channels .ch{display:inline-block;background:rgba(148,163,184,.2);color:#cbd5e1;padding:1px 6px;border-radius:8px;margin:2px 2px 2px 0;border:1px solid rgba(148,163,184,.3)}
.popup-channels .ch.prio{background:rgba(251,191,36,.25);border-color:rgba(251,191,36,.5);color:#fbbf24}
.popup-channels .ch.prio-l2{background:rgba(249,115,22,.28);border-color:rgba(251,146,60,.55);color:#fdba74}
.popup-channels .ch.trusted{background:rgba(22,163,74,.25);border-color:rgba(134,239,172,.4);color:#86efac}
.popup-remove-btn{margin-top:8px;width:100%;height:30px;font-size:.75rem;background:rgba(220,38,38,.25);border:1px solid rgba(248,113,113,.5);color:#fca5a5;border-radius:6px;cursor:pointer;font-weight:800}
.popup-toggle-btn{margin-top:6px;width:100%;height:30px;font-size:.75rem;background:rgba(34,211,238,.2);border:1px solid rgba(34,211,238,.5);color:#67e8f9;border-radius:6px;cursor:pointer;font-weight:800}
.popup-speed{background:rgba(234,88,12,.3);color:#fdba74;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.72rem;display:inline-block;margin-top:4px;border:1px solid rgba(253,186,116,.5)}
.popup-eta{background:rgba(220,38,38,.25);color:#fca5a5;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.4)}
.popup-alt{background:rgba(22,163,74,.25);color:#86efac;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(134,239,172,.4)}
.popup-trail{margin-top:6px;padding:6px 8px;border-radius:5px;background:rgba(148,163,184,.12);border:1px dashed rgba(148,163,184,.5);font-size:.68rem;line-height:1.45;color:#cbd5e1;max-height:150px;overflow-y:auto}
.popup-trail .pt-title{font-weight:700;color:#e2e8f0;margin-bottom:3px}
.popup-trail .pt-point{display:flex;gap:5px;align-items:flex-start;margin:1px 0}
.popup-trail .pt-num{flex-shrink:0;font-family:ui-monospace;color:#94a3b8;min-width:14px}
.popup-trail .pt-place{flex:1;color:#e2e8f0}
.popup-trail .pt-time{color:#94a3b8;font-size:.6rem;margin-left:3px}
.popup-trail .pt-arrow{color:#fbbf24;font-weight:800}
.threat-wrap{position:relative}
.threat-rotate{position:absolute;inset:0;transform-origin:center center;will-change:transform;display:flex;align-items:center;justify-content:center}
.threat-icon{display:flex;align-items:center;justify-content:center;transform-origin:center center;position:relative;animation:pulse 1.8s ease-in-out infinite;line-height:0}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(0,0,0,.5));opacity:1}50%{filter:drop-shadow(0 0 8px rgba(251,191,36,.55));opacity:.92}}
.threat-icon.falling{animation:fallingBlink .55s ease-in-out infinite}
@keyframes fallingBlink{0%,100%{filter:drop-shadow(0 0 2px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.35}}
.threat-icon.threat-pulse{animation:threatPulse 1s ease-in-out infinite}
@keyframes threatPulse{0%,100%{filter:drop-shadow(0 0 3px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.55}}
.threat-icon.ballistic-alarm{animation:ballisticAlarmPulse .5s ease-in-out infinite}
@keyframes ballisticAlarmPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(220,38,38,1))}50%{transform:scale(1.2);filter:drop-shadow(0 0 16px rgba(220,38,38,1));opacity:.75}}
.threat-icon.priority-star::after{content:"⭐";position:absolute;top:-10px;left:-6px;font-size:11px;filter:drop-shadow(0 0 3px rgba(251,191,36,1))}
.count-badge{position:absolute;right:-6px;top:-6px;height:14px;min-width:14px;padding:0 4px;border-radius:7px;background:#ea580c;color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid #fff;z-index:5}
.confirm-badge{position:absolute;left:-6px;top:-6px;height:13px;min-width:13px;padding:0 3px;border-radius:7px;background:#16a34a;color:#fff;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid #fff;z-index:5}
.confirm-badge.medium{background:#ca8a04}
.confirm-badge.low{background:#dc2626}
.confirm-badge.pending{background:#0ea5e9}
.strat-wrap{position:relative}
.strat-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
.strat-icon.training{animation:stratTrain 2.5s ease-in-out infinite}
.strat-icon.active{animation:stratActive 1.2s ease-in-out infinite}
@keyframes stratTrain{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes stratActive{0%,100%{filter:drop-shadow(0 0 6px rgba(250,204,21,.9))}50%{transform:scale(1.12)}}
.strat-badge{position:absolute;right:-6px;top:-6px;height:14px;min-width:14px;padding:0 4px;border-radius:7px;background:#facc15;color:#1f2937;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid #fff}
.impact-simple{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.err-banner{position:absolute;top:calc(36px + var(--safe-top));left:0;right:0;z-index:5000;background:#b91c1c;color:#fff;padding:8px 10px;font-size:.72rem;display:none}
.err-banner.show{display:block}
.err-banner .err-close{float:right;background:0;border:0;color:#fff;font-size:1.1rem;cursor:pointer;padding:0 4px}
.toast{position:absolute;left:50%;top:calc(48px + var(--safe-top) + 12px);transform:translateX(-50%);z-index:2000;background:var(--panel-solid);color:var(--text);padding:9px 14px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;max-width:85vw;text-align:center}
.toast.show{opacity:1}
.leaflet-control-attribution{font-size:8px!important;background:var(--panel)!important;color:var(--muted)!important}
.leaflet-control-zoom a{background:var(--btn-bg)!important;color:var(--text)!important;border:1px solid var(--border)!important;width:34px!important;height:34px!important;line-height:34px!important;font-size:16px!important;border-radius:10px!important;margin-bottom:4px!important}
.leaflet-control-scale{background:rgba(7,16,24,.85)!important;border:1px solid rgba(34,211,238,.25)!important;border-radius:6px!important;padding:2px 6px!important;color:#e2e8f0!important}
.settlement-marker{background:transparent;border:0}
.settlement-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;border:1.5px solid #fff}
.settlement-dot.city{background:#16a34a;width:11px;height:11px;border-width:2px}
.infra-marker{background:transparent;border:0}
.infra-bridge,.infra-energy,.infra-incident{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.user-loc-marker{position:relative;width:22px;height:22px}
.user-loc-dot{position:absolute;inset:0;border-radius:50%;background:#22d3ee;border:3px solid #fff;animation:userPulse 2s ease-in-out infinite}
@keyframes userPulse{0%,100%{box-shadow:0 0 0 2px rgba(34,211,238,.6)}50%{box-shadow:0 0 0 8px rgba(34,211,238,.15)}}
button.geo-btn.on{background:rgba(34,211,238,.9);color:#04202a;border-color:#22d3ee}
.tw-info-label{
  position:absolute;top:calc(100% + 11px);left:50%;transform:translateX(-50%);
  background:transparent;border:0;box-shadow:none;padding:0;
  white-space:nowrap;font-family:var(--font-ui);font-size:9px;font-weight:400;
  line-height:1.25;text-align:center;pointer-events:none;z-index:100;
}
.tw-info-label *{
  text-shadow:
    0 0 2px rgba(255,255,255,.95),
    0 0 4px rgba(255,255,255,.85),
    0 1px 1.5px rgba(0,0,0,.5),
    0 -1px 1.5px rgba(0,0,0,.4);
}
.tw-info-label .il-title{color:#000;font-weight:600;font-size:10px;letter-spacing:0;line-height:1.15}
.tw-info-label .il-row{display:flex;gap:3px;justify-content:center;align-items:center;font-size:9px;margin-top:0;line-height:1.15;font-weight:400}
.tw-info-label .il-row .sep{color:#000;opacity:.4;font-weight:400}
.tw-info-label .il-spd{color:#000;font-weight:500}
.tw-info-label .il-spd-table{color:#666;font-weight:400;font-style:italic}
.tw-info-label .il-alt{color:#0d8a3a;font-weight:500}
.tw-info-label .il-time{color:#5b21b6;font-weight:400}
.tw-info-label .il-eta{color:#c1121f;font-weight:500}

<script>
"use strict";

/* ============ 1. LOG ============ */
const RadarLog = (() => {
  const buf = []; const MAX = 200;
  function push(scope, msg, err) {
    buf.push({ t: Date.now(), scope, msg: String(msg) });
    if (buf.length > MAX) buf.shift();
    console.warn(`[radar:${scope}]`, msg, err || "");
  }
  function showBanner(m) {
    try { const b = document.getElementById("errBanner"), t = document.getElementById("errText");
      if (b && t) { t.textContent = String(m || "?"); b.classList.add("show"); } } catch (e) {}
  }
  return { push, showBanner };
})();
window.addEventListener("error", e => RadarLog.showBanner(e.message));

/* ============ 2. UTILS ============ */
const $ = id => document.getElementById(id);
const esc = s => (s == null ? "" : String(s)).replace(/</g, "&lt;").replace(/>/g, "&gt;");
const norm = s => (s || "").toLowerCase().replace(/[’`´']/g, "'").replace(/[^\p{L}\p{N}\s'-]/gu, " ").replace(/\s+/g, " ").trim();

function haversineKm(a, b, c, d) {
  if (![a, b, c, d].every(Number.isFinite)) return NaN;
  const R = 6371, toR = x => x * Math.PI / 180;
  const dLat = toR(c - a), dLon = toR(d - b);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a)) * Math.cos(toR(c)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearingBetween(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function destPoint(lat, lon, brg, distKm) {
  const R = 6371, br = brg * Math.PI / 180, lat1 = lat * Math.PI / 180, lon1 = lon * Math.PI / 180;
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distKm / R) + Math.cos(lat1) * Math.sin(distKm / R) * Math.cos(br));
  const lon2 = lon1 + Math.atan2(Math.sin(br) * Math.sin(distKm / R) * Math.cos(lat1), Math.cos(distKm / R) - Math.sin(lat1) * Math.sin(lat2));
  return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
}
function kyivHoldPoint() { return destPoint(CONFIG.KYIV[0], CONFIG.KYIV[1], CONFIG.KYIV_HOLD_BEARING, CONFIG.KYIV_HOLD_KM); }
function distToKyiv(lat, lon) { return haversineKm(lat, lon, CONFIG.KYIV[0], CONFIG.KYIV[1]); }
function showToast(msg, ms = 1800) {
  const t = $("toast"); if (!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), ms);
}
function formatEta(m) {
  if (m == null) return "—";
  if (m < 0.5) return "<1 хв";
  if (m < 60) return `~${Math.round(m)} хв`;
  return `~${Math.floor(m / 60)} год ${Math.round(m % 60)} хв`;
}
function formatAlt(alt) { if (alt == null) return ""; return alt >= 1000 ? (alt / 1000).toFixed(1).replace(/\.0$/, "") + " км" : alt + " м"; }
function formatAltRange(alt) { if (!alt) return "—"; const f = m => m >= 1000 ? (m / 1000).toFixed(1) + " км" : m + " м"; return `${f(alt.min)} – ${f(alt.max)}`; }
function compassName(deg) {
  if (deg == null || !Number.isFinite(deg)) return "—";
  const dirs = ["Пн","ПнСх","Сх","ПдСх","Пд","ПдЗх","Зх","ПнЗх"];
  return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
}
function levenshtein(a, b) {
  a = (a||"").toLowerCase(); b = (b||"").toLowerCase();
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const dp = Array.from({ length: m+1 }, () => new Array(n+1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[m][n];
}

/* ============ 3. CONFIG ============ */
const CONFIG = {
  API_THREATS: "https://neptun.in.ua/api/v1/threats",
  API_ALERTS: "https://neptun.in.ua/api/v1/alerts",
  API_MESSAGES: "https://neptun.in.ua/api/v1/messages",
  WS_URL: "wss://neptun.in.ua/api/v1/stream",
  POLL_MS: 5000,
  KYIV: [50.45, 30.52],
  ZONE_RADIUS_KM: 250,
  KYIV_OBLAST_RADIUS_KM: 120,
  KYIV_OBLAST_CENTER: [50.45, 30.52],
  UKRAINE_CENTER: [48.5, 31.0], UKRAINE_ZOOM: 6,
  STALE_MSG_MS: 20*60*1000, IMPACT_REPORT_TTL_MS: 30*60*1000,
  EXTRAPOLATION_HOURS: 0.4, STALE_VISUAL_AFTER_HOURS: 0.5,
  TRAIL_MIN_ORIGIN_DIST_KM: 30, UNCERTAIN_KM: 15,
  TRAIL_MAX_AGE_MS: 3*60*60*1000, TRAIL_MAX_POINTS: 2000, TRAIL_MAX_GAP_KM: 35,
  TRAIL_COLOR: "#dc2626", TRAIL_LINE_WIDTH: 2,
  TRAIL_MIN_DIST_KM: 0.15, TRAIL_MIN_TIME_MS: 10*1000,
  SIM_TRAIL_MIN_DIST_KM: 0.03,
  SMOOTH_ALPHA: 0.4,
  POPUP_OPTS: { maxWidth: 280, maxHeight: 300, autoPan: false, autoClose: true, closeOnClick: true, closeButton: true },
  TOP_ALERT_TTL_MS: 30*1000, TOP_ALERT_BALLISTIC_TTL_MS: 60*1000,
  DISMISS_TTL_MS: 30*60*1000,
  CHAIN_TRANSITION_MS_PER_KM: 500, CHAIN_TRANSITION_MIN_MS: 800, CHAIN_TRANSITION_MAX_MS: 5000,
  STRATEGIC_ACTIVITY_TTL_MS: 30*60*1000,
  SOUND_ENABLED: true, SOUND_NEAR_KM: 25, SOUND_NEAR_KM_ROCKET: 35,
  SOUND_NEAR_WINDOW_MS: 10000, SOUND_NEAR_WINDOW_MS_ROCKET: 5000, SOUND_COOLDOWN_MS: 4000,
  APPROACH_OFFSET_KM: 40,
  TILE_URL: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  TILE_URL_SAT: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  TILE_URL_SAT_REF: "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  TILE_ATTR: '&copy; OSM',
  TILE_ATTR_SAT: "Tiles &copy; Esri",
  BALLISTIC_COUNTDOWN_MS: 2*60*1000, BALLISTIC_MSG_MAX_AGE_MS: 5*60*1000,
  KYIV_HOLD_BEARING: 135, KYIV_HOLD_KM: 1.35, KYIV_HOLD_MIN_KM: 1.2, KYIV_HOLD_MAX_KM: 1.5,
  ALTITUDE_DROP_MIN_M: 200,
  ALTITUDE_DROP_RATIO: 0.20,
  ALTITUDE_DROP_COOLDOWN_MS: 12000
};
const SOUND_TYPE_FILTER = new Set(["uav","recon","geran5","missile","ballistic","banderol","jet_drone","kab","umpb","zircon","geran2","geran3","geran4"]);
const ROCKET_TYPES = new Set(["missile","ballistic","banderol","jet_drone","kab","umpb","zircon"]);
const OBSERVATION_TYPES = new Set(["banderol"]);

/* ============ 4. SCOPE ============ */
const Scope = (() => {
  let mode = "kyiv";
  try { const v = localStorage.getItem("kyiv_scope_mode_v1"); if (v === "kyiv" || v === "ukraine") mode = v; } catch (e) {}
  function get() { return mode; }
  function set(m) { mode = (m === "ukraine") ? "ukraine" : "kyiv"; try { localStorage.setItem("kyiv_scope_mode_v1", mode); } catch (e) {} }
  function isUkraine() { return mode === "ukraine"; }
  return { get, set, isUkraine };
})();
function inZone(lat, lon) {
  if (lat == null || lon == null) return false;
  if (Scope.isUkraine()) return lat >= 44 && lat <= 52.5 && lon >= 21.5 && lon <= 41;
  return haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], lat, lon) <= CONFIG.ZONE_RADIUS_KM;
}
function inKyivOblast(lat, lon) {
  if (lat == null || lon == null) return false;
  if (lat < 49.15 || lat > 51.65 || lon < 29.25 || lon > 32.35) return false;
  return haversineKm(CONFIG.KYIV_OBLAST_CENTER[0], CONFIG.KYIV_OBLAST_CENTER[1], lat, lon) <= 140;
}

/* ============ 5. CHANNELS ============ */
const PRIORITY_1 = new Set(["chyste_nebo","kyiv_monitor1","kyiv_airdef"]);
const PRIORITY_2 = new Set(["ukrainemonitorzagroz","ukraine_ua_24_7","ukraineradar_24_7","ukraineradar","kpszsu"]);
const PRIORITY_CHANNELS = new Set([...PRIORITY_1, ...PRIORITY_2]);
function normalizeChannel(ch) {
  if (!ch) return "unknown";
  let k = String(ch).trim().replace(/^@/, "");
  k = k.replace(/^https?:\/\/(?:t\.me|telegram\.me)\//i, "").replace(/\/+$/, "");
  return k.toLowerCase().replace(/\s+/g, "_") || "unknown";
}
function isPriorityChannel(ch) {
  const k = normalizeChannel(ch);
  if (PRIORITY_CHANNELS.has(k)) return true;
  for (const p of PRIORITY_CHANNELS) if (k.includes(p)) return true;
  return false;
}
function priorityLevel(ch) {
  const k = normalizeChannel(ch);
  if (PRIORITY_1.has(k)) return 1;
  if (PRIORITY_2.has(k)) return 2;
  for (const p of PRIORITY_1) if (k.includes(p)) return 1;
  for (const p of PRIORITY_2) if (k.includes(p)) return 2;
  return 0;
}
function channelWeight(name) {
  const lvl = priorityLevel(name);
  if (lvl === 1) return 3.0;
  if (lvl === 2) return 2.5;
  return 1.0;
}
function channelClass(name) {
  const lvl = priorityLevel(name);
  if (lvl === 1) return "prio";
  if (lvl === 2) return "prio-l2";
  return "";
}
function uniqueChannels(arr) {
  const out = new Set();
  if (!arr) return out;
  for (const ch of arr) out.add(normalizeChannel(ch));
  return out;
}
function totalWeightOf(set) {
  let w = 0;
  for (const ch of uniqueChannels(set)) w += channelWeight(ch);
  return w;
}
function hasPrioritySource(channels) {
  for (const ch of uniqueChannels(channels)) if (isPriorityChannel(ch)) return true;
  return false;
}
function confirmStats(channels) {
  const uniq = uniqueChannels(channels);
  return { confirmN: uniq.size, totalW: totalWeightOf(uniq), hasPrio: hasPrioritySource(uniq), channels: uniq };
}
function channelsListHtml(setOrArr) {
  const uniq = uniqueChannels(setOrArr);
  if (!uniq.size) return "";
  const chips = [...uniq].map(ch => `<span class="ch ${channelClass(ch)}">${esc(ch)}</span>`).join("");
  return `<div class="popup-channels"><b>Джерела (${uniq.size}):</b><br>${chips}</div>`;
}

/* ============ 6. GEO DATA ============ */
const KYIV_BRIDGES = [
{id:"b1",name:"Автовокзальний шляхопровід",type:"overpass",district:"Голосіївський",bank:"right",lat:50.421,lng:30.521},
{id:"b9",name:"Гаванський міст",type:"bridge",district:"Подільський",bank:"right",lat:50.468,lng:30.516},
{id:"b11",name:"Дарницький міст",type:"bridge",district:"Дніпровський",bank:"left",lat:50.421,lng:30.604},
{id:"b21",name:"Міст Метро",type:"metro",district:"Дніпровський",bank:"both",lat:50.449,lng:30.573},
{id:"b22",name:"Міст Патона",type:"bridge",district:"Печерський",bank:"both",lat:50.421,lng:30.587},

function findSettlementInText(text) {
  if (!text) return null;
  const low = norm(text);
  if (!low) return null;
  let best = null;
  for (const s of KYIV_OBLAST_SETTLEMENTS) {
    const n = norm(s[0]);
    if (n.length < 3) continue;
    const idx = low.indexOf(n);
    if (idx < 0) continue;
    const before = idx > 0 ? low[idx - 1] : " ", after = idx + n.length < low.length ? low[idx + n.length] : " ";
    if (!(/[^а-яіїєґa-z0-9]/i.test(before) || before === " ")) continue;
    if (!(/[^а-яіїєґa-z0-9]/i.test(after) || after === " ")) continue;
    const score = n.length * 10 + (s[4] === "c" ? 2 : 1);
    if (!best || score > best.score) best = { key: "s:" + n, name: s[0], lat: s[1], lon: s[2], index: idx, length: n.length, score };
  }
  return best;
}

  let best = null, bestS = 0;

    const n = norm(s[0]);
    if (n.length < 3) continue;
    if (low.includes(n)) return { key: "s:" + n, name: s[0], lat: s[1], lon: s[2] };
    const d = levenshtein(low.slice(0, n.length + 3), n);
    const sc = 1 - d / Math.max(low.length, n.length);

}

function observedSpeedFromPoints(points, windowMin) {

    .map(p => ({ lat: p.lat, lon: p.lng != null ? p.lng : p.lon, ts: p.ts || p.t }))
    .sort((a, b) => a.ts - b.ts);
  if (pts.length < 2) return null;

  if (recent.length < 2) return null;
  let totalKm = 0, totalH = 0, pairs = 0;
  for (let i = 1; i < recent.length; i++) {
    const a = recent[i-1], b = recent[i];

    if (dtH <= 0.001 || dtH > 1) continue;
    const d = haversineKm(a.lat, a.lon, b.lat, b.lon);
    if (d > 100) continue;
    if (d / dtH > 1500) continue;

  return Math.round(totalKm / totalH);

const RadarAudio = (() => {

/* ============ 15. IMPACT REPORTS ============ */

/* ============ 16. API / TRACKS ============ */
function normalizeThreat(t) {

  const cls = CLASSIFIER(txt);
  if (cls && !TYPE_META[t.type]) o.type = cls.type;
  o._exactName = detectExactName(txt) || null;

  o._speed = resolveSpeedKmh(o.type, txt);

}
function updateSmooth(tr, lat, lon, time, hdg) {
  if (!tr._s) { tr._s = {lat, lon, vx:0, vy:0, hdg:hdg||0, lastT:time, spd:0}; return; }
  const dt = (time - tr._s.lastT) / 3600000;
  if (dt <= 0 || dt > .4) { tr._s.lat = lat; tr._s.lon = lon; tr._s.lastT = time; return; }
  const dist = haversineKm(tr._s.lat, tr._s.lon, lat, lon);
  const spd = dist / dt;
  const brg = bearingBetween(tr._s.lat, tr._s.lon, lat, lon);
  const a = CONFIG.SMOOTH_ALPHA;
  tr._s.lat = tr._s.lat * (1-a) + lat * a;
  tr._s.lon = tr._s.lon * (1-a) + lon * a;

  tr._s.spd = Math.hypot(tr._s.vx, tr._s.vy);

}

    let heading = tx.heading ?? bearingBetween(tx.lat, tx.lon, CONFIG.KYIV[0], CONFIG.KYIV[1]);
    const baseTime = Date.now();
    const existing = State.tracks.get(tx.id);
    const speed = tx._speed || 180;
    const eta = etaToKyivMin(tx.lat, tx.lon, tx.type, speed);
    tx._labelTime = baseTime;
    tx._etaMin = eta;
    if (existing) {
      updateSmooth(existing, tx.lat, tx.lon, baseTime, heading);
      existing.threat = tx;
      existing.heading = heading;
      existing.speed = speed;
      existing.eta = eta;
      if (existing.marker) existing.marker.setIcon(makeIcon(tx, heading, 0, 0, false, false, null, null, false, false, false, speed));
    } else {
      const marker = L.marker([tx.lat, tx.lon], { icon: makeIcon(tx, heading, 0, 0, false, false, null, null, false, false, false, speed), zIndexOffset: 800 });
      marker.addTo(threatLayer);
      const tr = { id: tx.id, marker, threat: tx, heading, speed, eta, _s: {lat: tx.lat, lon: tx.lon, lastT: baseTime, hdg: heading, spd: 0, vx: 0, vy: 0} };

}
function syncThreats(list) {

    watchId = navigator.geolocation.watchPosition(onPosition, () => {}, { enableHighAccuracy: true });
    enabled = true;
    $("btnGeo")?.classList.add("on");
    showToast("🧭 Увімкнено");
  }
  function stop() {
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    enabled = false;
    $("btnGeo")?.classList.remove("on");
    if (marker && map) { map.removeLayer(marker); marker = null; }
    showToast("🧭 Вимкнено");
  }
  function toggle() { enabled ? stop() : start(); }
  function center() { if (lastCoords) map.setView([lastCoords.lat, lastCoords.lon], 14); }
  return { start, stop, toggle, center, isEnabled: () => enabled, getLast: () => lastCoords };
})();
window.GeoLoc = GeoLoc;

/* ============ 25. UI ============ */
function setStatus(state, text) {
  const dot = $("statusDot"), tt = $("statusText");
  if (!dot || !tt) return;
  dot.className = "status-dot" + (state === "err" ? " err" : state === "warn" ? " warn" : "");
  tt.textContent = text || "ONLINE";
}
function applyScopeMode(flyTo) {
  if (!map) return;
  if (Scope.isUkraine()) map.setView([48.5, 31.0], 6);
  else map.setView(CONFIG.KYIV, 6);
  const b = $("btnScope");
  if (b) b.textContent = Scope.isUkraine() ? "🇺🇦" : "🌍";
}
function toggleScope() {
  Scope.set(Scope.isUkraine() ? "kyiv" : "ukraine");
  applyScopeMode(true);
  showToast(Scope.isUkraine() ? "🇺🇦 Вся Україна" : "🎯 Київ + 250 км");
}
function initUI() {
  $("btnRefresh").addEventListener("click", () => { RadarAudio.unlock(); Net.fetchMessages(); showToast("Оновлення…"); });
  $("btnClear").addEventListener("click", () => { RadarAudio.unlock(); State.clearAll(); showToast("Очищено"); });
  $("btnQuickStatus").addEventListener("click", () => { RadarAudio.unlock(); showToast("📊 Загроз: " + State.tracks.size + " · Треків: " + State.trails.size); });
  $("btnScope").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); RadarAudio.unlock(); toggleScope(); });
  $("topAlertClose").addEventListener("click", () => Alerts.hideTopAlert());
  $("massBannerClose").addEventListener("click", () => Mass.hideBanner());
  $("strategicPanelClose").addEventListener("click", () => { $("strategicPanel").classList.remove("show"); });
  (function soundBtn() {
    const b = $("soundToggle"); if (!b) return;
    function update() { b.textContent = CONFIG.SOUND_ENABLED ? "🔔" : "🔕"; b.className = "sound-btn " + (CONFIG.SOUND_ENABLED ? "on" : "muted"); }
    update();
    b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); RadarAudio.unlock(); CONFIG.SOUND_ENABLED = !CONFIG.SOUND_ENABLED; update(); showToast(CONFIG.SOUND_ENABLED ? "🔔 увімк" : "🔕 вимк"); });
  })();
  $("sirenBtn").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); RadarAudio.unlock(); RadarAudio.triggerSirenSequence(3000, 1); showToast("🚨 Тест"); });
  (function ringsBtn() {
    const b = $("btnRingsToggle"); if (!b || !map) return;
    b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); ringsVisible = !ringsVisible; if (ringsVisible) ringsLayer.addTo(map); else map.removeLayer(ringsLayer); b.classList.toggle("on", ringsVisible); });
  })();
  (function mapBtn() {
    const b = $("btnMapToggle"); if (!b || !map) return;
    const bases = ["sat","osm","omt"]; let idx = 0;
    function apply() {
      if (map.hasLayer(baseSat)) map.removeLayer(baseSat);
      if (map.hasLayer(osmLayer)) map.removeLayer(osmLayer);
      if (map.hasLayer(openMapTilesLayer)) map.removeLayer(openMapTilesLayer);
      if (bases[idx] === "sat") baseSat.addTo(map);
      else if (bases[idx] === "osm") osmLayer.addTo(map);
      else openMapTilesLayer.addTo(map);
      b.textContent = { sat:"🛰", osm:"🗺", omt:"🌍" }[bases[idx]];
    }
    apply();
    b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); idx = (idx+1)%3; apply(); });
  })();
  $("btnSettlements").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); toggleSettlementsLayer(); });
  $("btnStrategic").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); toggleStrategicLayer(); });
  $("btnInfra").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); cycleInfraMode(); });
  $("btnPower").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); togglePowerLayer(); });
  $("btnMass").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); Mass.hideBanner(); });
  $("btnVisual").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    const allOn = Object.values(VIS_FLAGS).every(v => v);
    for (const k of Object.keys(VIS_FLAGS)) VIS_FLAGS[k] = !allOn;
    saveVisFlags();
    document.body.classList.toggle("card-on", VIS_FLAGS.card);
    const card = $("bottomCard"); if (card) card.classList.toggle("show", VIS_FLAGS.card);
    redrawAllIcons();
    updateBottomCard();
  });
  $("btnGeo").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); GeoLoc.toggle(); });
  $("btnFullscreen").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(()=>{});
  });
  document.addEventListener("click", e => {
    const btn = e.target.closest(".popup-remove-btn");
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    const kind = btn.getAttribute("data-remove-kind"), key = btn.getAttribute("data-remove-key");
    if (kind && key) { removeMarkerByKey(kind, key); try { map.closePopup(); } catch (_) {} }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopAnim();
    else startAnim();
  });
}

function initSearch() {
  const input = $("searchInput"), btn = $("searchBtn"), results = $("searchResults");
  if (!input || !btn || !results) return;
  function hideResults() { results.classList.remove("show"); }
  btn.addEventListener("click", async e => {
    e.preventDefault();
    const q = input.value.trim();
    if (q.length < 2) return;
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=8&countrycodes=ua&accept-language=uk`;
      const data = await (await fetch(url)).json();
      results.innerHTML = (data||[]).map((d,i) => `<div class="search-item" data-i="${i}"><div class="name">${esc(d.display_name.split(",")[0])}</div><div class="addr">${esc(d.display_name)}</div></div>`).join("");
      results.classList.add("show");
      results.querySelectorAll(".search-item").forEach(el => el.addEventListener("click", () => {
        const it = data[+el.dataset.i];
        if (it) { map.setView([+it.lat, +it.lon], 14); hideResults(); }
      }));
    } catch (err) { showToast("Помилка пошуку"); }
  });
}

/* ============ 26. INIT ============ */
async function init() {
  try {
    loadSettings();
    initMap();
    if (!map) { RadarLog.showBanner("Карта не завантажилась"); return; }
    initUI();
    initSearch();
    applyScopeMode(false);
    Net.connect();
    Net.fetchMessages();
    setInterval(Net.fetchMessages, 5000);
    startAnim();
    setTimeout(() => RadarAudio.unlock(), 500);
    const b = $("btnInfra");
    if (b) { b.classList.remove("on","infrastructure","energy","incidents"); if (infraMode===1) b.classList.add("infrastructure"); else if (infraMode===2) b.classList.add("energy"); else if (infraMode===4) b.classList.add("on"); }
    if (infraMode > 0) rebuildInfraLayer();
    if (powerVisible) rebuildPowerLayer();
    document.body.classList.toggle("card-on", VIS_FLAGS.card);
    const bc = $("bottomCard"); if (bc) bc.classList.toggle("show", VIS_FLAGS.card);
    updateBottomCard();
    console.log("[radar] ready v16.3");
  } catch (e) { RadarLog.showBanner("init: " + (e.message || e)); }
}
function loadSettings() {
  try { if (localStorage.getItem("kyiv_rings_v41") === "1") ringsVisible = true; } catch (e) {}
  try { if (localStorage.getItem("kyiv_settlements_v41") === "1") settlementsVisible = true; } catch (e) {}
  try { if (localStorage.getItem("kyiv_strategic_v41") === "1") strategicVisible = true; } catch (e) {}
  try { const v = localStorage.getItem("kyiv_infra_mode_v41"); if (v != null) { const i = +v; if (i >= 0 && i <= 4) infraMode = i; } } catch (e) {}
  try { if (localStorage.getItem("kyiv_power_vis_v1") === "1") powerVisible = true; } catch (e) {}
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
